name: order_admin
description: "Order Delivery Admin App — Super Admin, Admin, Vendor dashboards"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  http: ^1.3.0
  http_parser: ^4.1.2
  get_storage: ^2.1.1
  intl: ^0.20.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  image_picker: ^1.2.1
  pdf: ^3.12.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  windows:
    generate: true
    image_path: "assets/launcher1.jpg"
    icon_size: 48
  image_path: "assets/launcher1.jpg"
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/launcher1.jpg
